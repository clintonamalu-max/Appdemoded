<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Drafted — Screenplay Editor</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drafted">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js"></script>
<style>
  :root{
    --bg: #0f1420;
    --bg-soft: #1a2233;
    --paper: #eef1f5;
    --paper-edge: #d7dde6;
    --ink: #232a3a;
    --ink-soft: #6b7585;
    --accent: #4f7cdb;
    --accent-soft: rgba(79,124,219,0.14);
    --line: #2a3344;
    --line-paper: #c9d2dd;
  }

  *{ box-sizing: border-box; }

  html{ height:100%; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{ height:100%; min-height:100vh; min-height:100dvh; }

  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(79,124,219,0.10), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(255,255,255,0.03), transparent 50%);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ===== Top bar ===== */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: clamp(10px, 1.6vw, 14px) clamp(14px, 2.6vw, 22px);
    border-bottom: 1px solid var(--line);
    flex-shrink:0;
    gap: clamp(10px, 1.6vw, 16px);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--paper);
  }
  .brand .mark{
    font-family:'Courier Prime', monospace;
    font-weight:700;
    font-size: 1.05rem;
    letter-spacing: 0.18em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 7px;
    border-radius: 3px;
  }
  .brand h1{
    font-size: 1.05rem;
    font-weight: 600;
    margin:0;
    letter-spacing: 0.01em;
  }
  .brand .file-title{
    font-family:'Courier Prime', monospace;
    color: var(--ink-soft);
    font-size: 0.85rem;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    padding: 2px 2px;
    color: #c8cedb;
    min-width: 120px;
  }
  .brand .file-title:focus{
    outline:none;
    border-bottom: 1px dashed var(--accent);
  }

  .toolbar{
    display:flex;
    gap: 6px;
    align-items:center;
    flex-wrap: wrap;
  }

  button.tool{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: #d3d8e3;
    font-family: 'Courier Prime', monospace;
    font-size: clamp(0.7rem, 0.55vw + 0.55rem, 0.78rem);
    letter-spacing: 0.04em;
    padding: clamp(6px, 0.6vw, 7px) clamp(8px, 1.2vw, 12px);
    border-radius: 4px;
    cursor:pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    white-space: nowrap;
  }
  button.tool:hover{
    border-color: var(--accent);
    color: var(--paper);
  }
  button.tool.active{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--paper);
  }
  button.tool:disabled{
    opacity:0.35;
    cursor:default;
  }
  .divider{
    width:1px;
    height: 22px;
    background: var(--line);
    margin: 0 4px;
  }

  /* ===== Main layout ===== */
  .workspace{
    flex:1;
    display:flex;
    overflow:hidden;
  }

  /* Sidebar */
  .sidebar{
    width: 230px;
    flex-shrink:0;
    border-right: 1px solid var(--line);
    background: var(--bg-soft);
    display:flex;
    flex-direction:column;
    transition: margin-left 0.2s ease;
  }
  .sidebar.collapsed{ margin-left: -231px; }

  .sidebar h2{
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    color:#8c95a8;
    padding: 16px 18px 8px;
    margin:0;
  }

  .scene-list{
    flex:1;
    overflow-y:auto;
    padding: 0 8px 16px;
  }
  .scene-item{
    display:flex;
    gap: 10px;
    align-items:flex-start;
    padding: 9px 10px;
    border-radius: 4px;
    cursor:pointer;
    color: #c8cedb;
    font-size: 0.82rem;
    line-height:1.35;
  }
  .scene-item:hover{ background: rgba(255,255,255,0.04); }
  .scene-item .num{
    font-family:'Courier Prime', monospace;
    color: var(--accent);
    font-size: 0.75rem;
    flex-shrink:0;
    width: 22px;
    text-align:right;
    padding-top:1px;
  }
  .scene-item .label{
    font-family:'Courier Prime', monospace;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .empty-scenes{
    color: var(--ink-soft);
    color:#757e92;
    font-size: 0.8rem;
    padding: 10px 12px;
    line-height:1.5;
    font-style: italic;
  }

  .stats{
    border-top: 1px solid var(--line);
    padding: 14px 18px 16px;
    font-family: 'Courier Prime', monospace;
    font-size: 0.78rem;
    color: #8c95a8;
    display:flex;
    flex-direction:column;
    gap: 5px;
  }
  .stats .row{ display:flex; justify-content:space-between; }
  .stats .row span:last-child{ color: var(--paper); }

  /* Page area */
  .page-area{
    flex:1;
    overflow-y:auto;
    display:flex;
    justify-content:center;
    padding: clamp(18px, 4vw, 40px) clamp(12px, 3vw, 24px) clamp(90px, 10vw, 120px);
  }

  .page{
    width: 100%;
    max-width: 700px;
    background: var(--paper);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
    min-height: 900px;
    padding: clamp(28px, 7vw, 70px) clamp(20px, 6vw, 60px);
    position:relative;
  }

  #editor{
    font-family: 'Courier Prime', monospace;
    font-size: clamp(14px, 0.85vw + 10px, 16px);
    line-height: 1.65;
    color: var(--ink);
    min-height: 760px;
    outline:none;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  #editor:empty::before{
    content: "FADE IN:\A\AINT. LOCATION — DAY\A\AStart typing your scene...";
    white-space: pre-wrap;
    color: #a3aebd;
    font-style: italic;
  }

  /* Element type styles */
  .el{
    display:block;
    margin: 0;
    padding: 2px 0;
    position:relative;
  }
  .el-scene{
    text-transform: uppercase;
    font-weight: 700;
    margin-top: 22px;
    letter-spacing: 0.02em;
  }
  .el-action{
    max-width: 100%;
  }
  .el-character{
    text-transform: uppercase;
    margin-left: 38%;
    margin-top: 14px;
    font-weight:700;
  }
  .el-dialogue{
    margin-left: 18%;
    margin-right: 18%;
  }
  .el-parenthetical{
    margin-left: 30%;
    margin-right: 22%;
    font-style: italic;
    color: #4f5a6e;
  }
  .el-transition{
    text-transform: uppercase;
    text-align: right;
    margin-top: 14px;
    color: #757e92;
  }

  .el::before{
    content: attr(data-label);
    position:absolute;
    left: -78px;
    top: 3px;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    font-family: 'Space Grotesk', sans-serif;
    opacity:0;
    transition: opacity 0.12s;
    pointer-events:none;
  }
  .el:focus::before{ opacity:1; }

  /* Floating format pill */
  .format-pill{
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display:flex;
    gap: 4px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    z-index: 50;
  }
  .format-pill button{
    background: transparent;
    border: none;
    color: #c8cedb;
    font-family:'Courier Prime', monospace;
    font-size: 0.74rem;
    letter-spacing: 0.05em;
    padding: 8px 14px;
    border-radius: 999px;
    cursor:pointer;
    transition: background 0.15s, color 0.15s;
    text-transform: uppercase;
  }
  .format-pill button:hover{
    background: rgba(255,255,255,0.06);
    color: var(--paper);
  }
  .format-pill button.current{
    background: var(--accent);
    color: var(--paper);
  }
  .format-pill .hint{
    color: #757e92;
    font-size: 0.68rem;
    align-self:center;
    padding: 0 10px 0 4px;
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: 0.04em;
    border-right: 1px solid var(--line);
    margin-right: 2px;
  }

  /* Find & Replace */
  .find-bar{
    position:absolute;
    top: 14px;
    right: 14px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
    display:flex;
    gap: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 40;
    flex-wrap: wrap;
    max-width: 360px;
  }
  .find-bar input{
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--paper);
    font-family:'Courier Prime', monospace;
    font-size: 0.8rem;
    padding: 6px 8px;
    border-radius: 4px;
    width: 130px;
  }
  .find-bar input:focus{ outline:1px solid var(--accent); }
  .find-bar button{
    background: var(--accent);
    border:none;
    color: var(--paper);
    font-family:'Courier Prime', monospace;
    font-size: 0.74rem;
    padding: 6px 10px;
    border-radius: 4px;
    cursor:pointer;
    text-transform: uppercase;
    letter-spacing:0.05em;
  }
  .find-bar button.ghost{
    background: transparent;
    border: 1px solid var(--line);
    color:#c8cedb;
  }
  .find-bar .count{
    color:#8c95a8;
    font-size:0.72rem;
    font-family:'Courier Prime', monospace;
    align-self:center;
  }
  .find-bar.hidden{ display:none; }

  mark.found{
    background: var(--accent-soft);
    outline: 1px solid var(--accent);
    border-radius: 2px;
  }
  mark.found.active{
    background: var(--accent);
    color: var(--paper);
  }

  /* ===== Backdrop for off-canvas sidebar (tablet/phone) ===== */
  .sidebar-backdrop{
    display:none;
  }

  /* ===== Large desktop: more breathing room ===== */
  @media (min-width: 1440px){
    .sidebar{ width: 260px; }
    .sidebar.collapsed{ margin-left: -261px; }
    .page{ max-width: 820px; }
  }

  /* ===== Tablet: off-canvas sidebar drawer ===== */
  @media (max-width: 900px){
    .sidebar{
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      height: 100%;
      width: min(280px, 78vw);
      margin-left: 0 !important;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 10px 0 30px rgba(0,0,0,0.45);
      z-index: 70;
    }
    .sidebar:not(.collapsed){ transform: translateX(0); }
    .sidebar-backdrop{
      display:block;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 60;
      opacity:0;
      pointer-events:none;
      transition: opacity 0.25s ease;
    }
    .sidebar-backdrop.show{ opacity:1; pointer-events:auto; }
    .page{ max-width: 640px; }
  }

  /* ===== Phone: full mobile layout ===== */
  @media (max-width: 640px){

    /* --- Page / editor --- */
    .page{ padding: 24px 16px; min-height: auto; }
    .el-character{ margin-left: 18%; }
    .el-dialogue{ margin-left: 5%; margin-right: 5%; }
    .el-parenthetical{ margin-left: 12%; margin-right: 6%; }
    .el::before{ display: none; }  /* hide type labels on small screens */
    #editor{ min-height: 60vh; font-size: 13px; }
    .page-area{ padding: 12px 8px 110px; }

    /* --- Header: two-row layout --- */
    header{
      flex-direction: column;
      flex-wrap: nowrap;
      align-items: stretch;
      padding: 0;
      gap: 0;
    }

    /* Row 1: back btn + title + menu */
    .brand{
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      min-height: 48px;
      overflow: hidden;
    }
    .brand .mark{ display: none; }
    .brand h1{ display: none; }
    .brand .file-title{
      flex: 1 1 0;
      min-width: 0;
      width: auto;
      font-size: 15px;
      font-weight: 600;
      padding: 4px 0;
      color: var(--paper);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Row 2: toolbar as icon strip */
    .toolbar{
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 6px 10px;
      gap: 6px;
      align-items: center;
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar{ display: none; }

    button.tool{
      flex-shrink: 0;
      font-size: 12px;
      padding: 8px 12px;
      min-height: 36px;
      white-space: nowrap;
    }
    .divider{ flex-shrink: 0; height: 18px; margin: 0 2px; }

    /* --- Format pill --- */
    .format-pill{
      left: 0;
      right: 0;
      bottom: 0;
      transform: none;
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-bottom: none;
      overflow-x: auto;
      justify-content: flex-start;
      max-width: none;
      scrollbar-width: none;
      padding: 6px 10px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      gap: 4px;
    }
    .format-pill::-webkit-scrollbar{ display: none; }
    .format-pill .hint{ display: none; }
    .format-pill button{
      flex-shrink: 0;
      padding: 8px 14px;
      font-size: 12px;
      min-height: 36px;
    }

    /* --- Find bar --- */
    .find-bar{
      top: 4px;
      right: 8px;
      left: 8px;
      max-width: none;
    }
    .find-bar input{ flex: 1 1 80px; font-size: 16px; min-width: 0; }

    /* --- Back button sizing --- */
    .back-btn{
      min-height: 36px;
      padding: 0 12px;
      font-size: 13px;
      flex-shrink: 0;
    }

    /* --- Menu button --- */
    .menu-btn{ width: 36px; height: 36px; flex-shrink: 0; }

    /* --- Dropdown --- */
    .dropdown{ min-width: 200px; }

    /* --- Homepage --- */
    #homepage{ padding: 20px 14px 32px; }
    .home-header{ margin-bottom: 20px; }
    .home-brand h1{ font-size: 1rem; }
    .btn-new-script{ padding: 10px 16px; font-size: 0.85rem; }
    .scripts-grid{ grid-template-columns: 1fr; gap: 10px; }
    .script-card{ min-height: 96px; padding: 14px 14px 12px; }
    .card-delete{ opacity: 1; }  /* always visible on touch */
  }

  @media (max-width: 400px){
    button.tool{ padding: 8px 9px; font-size: 11px; }
    .brand .file-title{ font-size: 14px; }
    .btn-new-script{ font-size: 0.8rem; padding: 9px 13px; }
  }


  ::-webkit-scrollbar{ width: 10px; }
  ::-webkit-scrollbar-track{ background: var(--bg); }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 5px; }

  /* ===== Menu button + dropdown ===== */
  .menu-wrap{
    position: relative;
    flex-shrink: 0;
  }
  .menu-btn{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: #d3d8e3;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 1.1rem;
    line-height:1;
    letter-spacing: 2px;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .menu-btn:hover{
    border-color: var(--accent);
    color: var(--paper);
  }
  .menu-btn.active{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--paper);
  }

  .dropdown{
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 220px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    z-index: 80;
    padding: 6px;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
  }
  .dropdown.open{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .dropdown .section-label{
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #757e92;
    padding: 8px 10px 4px;
  }
  .dropdown button{
    display:flex;
    align-items:center;
    gap: 10px;
    width: 100%;
    background: transparent;
    border: none;
    color: #d3d8e3;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem;
    text-align: left;
    padding: 9px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .dropdown button:hover{
    background: var(--accent);
    color: var(--paper);
  }
  .dropdown button .icon{
    font-family: 'Courier Prime', monospace;
    font-size: 0.78rem;
    width: 20px;
    text-align: center;
    flex-shrink:0;
    opacity: 0.85;
  }
  .dropdown button .label-stack{
    display:flex;
    flex-direction: column;
  }
  .dropdown button .desc{
    display:block;
    font-size: 0.7rem;
    color: #8c95a8;
    margin-top: 1px;
  }
  .dropdown button:hover .desc{ color: rgba(255,255,255,0.75); }
  .dropdown .divider-h{
    height: 1px;
    background: var(--line);
    margin: 5px 4px;
  }

  .menu-backdrop{
    display:none;
  }
  .menu-backdrop.show{
    display:block;
    position: fixed;
    inset: 0;
    z-index: 75;
    background: transparent;
  }

  @media (max-width: 640px){
    .dropdown{ min-width: 200px; }
  }

  /* ===== Homepage ===== */
  #homepage{
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow-y: auto;
    padding: clamp(24px, 5vw, 48px) clamp(18px, 5vw, 48px) 40px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .home-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: clamp(24px, 4vw, 40px);
    gap: 16px;
  }
  .home-brand{
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .home-brand .mark{
    font-family: 'Courier Prime', monospace;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.18em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 8px;
    border-radius: 3px;
  }
  .home-brand h1{
    font-size: clamp(1.05rem, 2vw, 1.2rem);
    font-weight: 600;
    margin: 0;
    color: var(--paper);
    letter-spacing: 0.01em;
  }

  .btn-new-script{
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    padding: clamp(10px, 1.5vw, 13px) clamp(16px, 2.5vw, 22px);
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-new-script:hover{ background: #3d69c8; }
  .btn-new-script:active{ transform: scale(0.97); }
  .btn-new-script .plus{ font-size: 1.2rem; line-height: 1; }

  .section-title{
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: #757e92;
    margin: 0 0 14px;
  }

  .scripts-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .script-card{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 18px 14px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    min-height: 120px;
  }
  .script-card:hover{
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .script-card:active{ transform: translateY(0); }

  .card-icon{
    font-family: 'Courier Prime', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .card-title{
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--paper);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-meta{
    display: flex;
    gap: 10px;
    font-size: 0.72rem;
    color: #757e92;
    font-family: 'Courier Prime', monospace;
    margin-top: auto;
    flex-wrap: wrap;
  }
  .card-meta span{ white-space: nowrap; }

  .card-delete{
    position: absolute;
    top: 10px;
    right: 10px;
    background: transparent;
    border: none;
    color: #757e92;
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.12s, color 0.12s, background 0.12s;
  }
  .script-card:hover .card-delete{ opacity: 1; }
  .card-delete:hover{ background: rgba(255,60,60,0.12); color: #e05; }

  .empty-home{
    grid-column: 1 / -1;
    padding: 48px 24px;
    text-align: center;
    color: #757e92;
    font-family: 'Courier Prime', monospace;
    font-size: 0.9rem;
    line-height: 1.8;
    border: 1px dashed var(--line);
    border-radius: 10px;
  }
  .empty-home strong{
    display: block;
    color: #8c95a8;
    font-size: 1rem;
    margin-bottom: 6px;
    font-family: 'Space Grotesk', sans-serif;
  }

  /* ===== Editor screen ===== */
  #editorScreen{
    display: none;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }
  #editorScreen.active{
    display: flex;
  }

  /* Back button in header */
  .back-btn{
    background: transparent;
    border: 1px solid var(--line);
    color: #c8cedb;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.78rem;
    padding: 6px 11px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: border-color 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .back-btn:hover{ border-color: var(--accent); color: var(--paper); }

  /* Homepage screen wrapper */
  #homeScreen{
    display: flex;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
  }
  #homeScreen.hidden{ display: none; }
</style>
</head>
<body>

<!-- ===== HOME SCREEN ===== -->
<div id="homeScreen">
  <div id="homepage">
    <div class="home-header">
      <div class="home-brand">
        <span class="mark">DFT</span>
        <h1>Drafted</h1>
      </div>
      <button class="btn-new-script" id="newScriptBtn">
        <span class="plus">＋</span> New Script
      </button>
    </div>
    <p class="section-title">Recent Scripts</p>
    <div class="scripts-grid" id="scriptsGrid">
      <div class="empty-home">
        <strong>No scripts yet</strong>
        Tap "New Script" to start your first screenplay.
      </div>
    </div>
  </div>
</div>

<!-- ===== EDITOR SCREEN ===== -->
<div id="editorScreen">

  <header>
    <div class="brand">
      <button class="back-btn" id="backBtn">← Home</button>
      <div class="menu-wrap">
        <button class="menu-btn" id="menuBtn" title="Menu" aria-haspopup="true" aria-expanded="false">⋮</button>
        <div class="dropdown" id="exportDropdown">
          <div class="section-label">Export as</div>
          <button id="exportTxt"><span class="icon">TXT</span><span class="label-stack"><span>Plain text</span><span class="desc">.txt — universal, lightweight</span></span></button>
          <button id="exportPdf"><span class="icon">PDF</span><span class="label-stack"><span>PDF document</span><span class="desc">.pdf — formatted, print-ready</span></span></button>
          <button id="exportDocx"><span class="icon">DOC</span><span class="label-stack"><span>Word document</span><span class="desc">.docx — editable in Microsoft Word</span></span></button>
          <div class="divider-h" id="installDivider" style="display:none;"></div>
          <button id="installApp" style="display:none;"><span class="icon">⤓</span><span class="label-stack"><span>Install app</span><span class="desc">Add Drafted to your home screen</span></span></button>
        </div>
      </div>
      <span class="mark">DFT</span>
      <input class="file-title" id="fileTitle" value="Untitled Screenplay" spellcheck="false">
    </div>
    <div class="toolbar">
      <button class="tool" id="undoBtn" title="Undo (Ctrl+Z)">⟲ Undo</button>
      <button class="tool" id="redoBtn" title="Redo (Ctrl+Shift+Z)">⟳ Redo</button>
      <div class="divider"></div>
      <button class="tool" id="findBtn" title="Find & Replace (Ctrl+F)">⌕ Find</button>
      <button class="tool" id="sidebarBtn" title="Toggle scene list">☰ Scenes</button>
    </div>
  </header>

  <div class="menu-backdrop" id="menuBackdrop"></div>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <h2>Scenes</h2>
      <div class="scene-list" id="sceneList">
        <div class="empty-scenes">Scene headings (INT. or EXT.) will appear here.</div>
      </div>
      <div class="stats">
        <div class="row"><span>Pages</span><span id="statPages">1</span></div>
        <div class="row"><span>Words</span><span id="statWords">0</span></div>
        <div class="row"><span>Scenes</span><span id="statScenes">0</span></div>
        <div class="row"><span>Est. runtime</span><span id="statTime">0 min</span></div>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="page-area" id="pageArea">
      <div class="page" id="pageWrap">
        <div class="find-bar hidden" id="findBar">
          <input type="text" id="findInput" placeholder="Find" autocomplete="off">
          <input type="text" id="replaceInput" placeholder="Replace" autocomplete="off">
          <span class="count" id="findCount"></span>
          <button id="findNext">Next</button>
          <button class="ghost" id="replaceOne">Replace</button>
          <button class="ghost" id="replaceAll">All</button>
          <button class="ghost" id="findClose">✕</button>
        </div>
        <div id="editor" contenteditable="true" spellcheck="true"></div>
      </div>
    </div>
  </div>

  <div class="format-pill" id="formatPill">
    <span class="hint">Tab cycles • Ctrl+1–6</span>
    <button data-type="scene" data-key="1">Scene</button>
    <button data-type="action" data-key="2">Action</button>
    <button data-type="character" data-key="3">Character</button>
    <button data-type="dialogue" data-key="4">Dialogue</button>
    <button data-type="parenthetical" data-key="5">Parens</button>
    <button data-type="transition" data-key="6">Transition</button>
  </div>

</div><!-- /editorScreen -->

<script>
(function(){
  const editor = document.getElementById('editor');
  const sceneList = document.getElementById('sceneList');
  const sidebar = document.getElementById('sidebar');
  const formatPill = document.getElementById('formatPill');
  const findBar = document.getElementById('findBar');
  const fileTitle = document.getElementById('fileTitle');

  const TYPE_CYCLE = ['action','scene','character','dialogue','parenthetical','transition'];
  const TYPE_LABELS = {
    scene: 'Scene Heading',
    action: 'Action',
    character: 'Character',
    dialogue: 'Dialogue',
    parenthetical: 'Parenthetical',
    transition: 'Transition'
  };

  // ---------- History (undo/redo) ----------
  let history = [];
  let historyIndex = -1;
  let suppressHistory = false;
  const MAX_HISTORY = 100;

  function snapshot(){
    if(suppressHistory) return;
    const html = editor.innerHTML;
    if(history[historyIndex] === html) return;
    history = history.slice(0, historyIndex + 1);
    history.push(html);
    if(history.length > MAX_HISTORY) history.shift();
    historyIndex = history.length - 1;
    updateUndoRedoButtons();
  }

  function restoreSnapshot(idx){
    suppressHistory = true;
    editor.innerHTML = history[idx];
    placeCaretAtEnd(editor);
    suppressHistory = false;
    refreshAll();
  }

  function undo(){
    if(historyIndex > 0){
      historyIndex--;
      restoreSnapshot(historyIndex);
    }
    updateUndoRedoButtons();
  }
  function redo(){
    if(historyIndex < history.length - 1){
      historyIndex++;
      restoreSnapshot(historyIndex);
    }
    updateUndoRedoButtons();
  }
  function updateUndoRedoButtons(){
    document.getElementById('undoBtn').disabled = historyIndex <= 0;
    document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
  }

  function placeCaretAtEnd(el){
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(el);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  // ---------- Element creation ----------
  function makeElement(type, text){
    const div = document.createElement('div');
    div.className = 'el el-' + type;
    div.dataset.type = type;
    div.dataset.label = TYPE_LABELS[type];
    div.contentEditable = true;
    if(text){
      div.appendChild(document.createTextNode(text));
    }
    return div;
  }

  function ensureEditorHasLine(){
    if(editor.children.length === 0){
      const first = makeElement('action', '');
      editor.appendChild(first);
    }
  }

  // ---------- Auto-detection of element type ----------
  function detectType(text){
    const t = text.trim();
    if(/^(INT|EXT|EST|INT\/EXT|I\/E)[.\s]/i.test(t)) return 'scene';
    if(/^(FADE IN|FADE OUT|CUT TO|DISSOLVE TO|SMASH CUT|MATCH CUT|TIME CUT)[:\.]?\s*$/i.test(t)) return 'transition';
    if(/^\(.*\)?$/.test(t) && t.length > 0 && t.startsWith('(')) return 'parenthetical';
    return null; // no strong signal
  }

  // Auto-uppercase scene headings & character cues as typed
  function maybeAutoFormat(div){
    const text = getElText(div);
    const detected = detectType(text);
    if(detected && div.dataset.type !== detected && text.trim().length > 2){
      // only auto-switch if user hasn't manually overridden this line yet
      if(!div.dataset.manual){
        setElType(div, detected);
      }
    }
  }

  function getElText(div){
    return div.textContent || '';
  }

  function setElType(div, type){
    div.className = 'el el-' + type;
    div.dataset.type = type;
    div.dataset.label = TYPE_LABELS[type];
  }

  // ---------- Caret helpers ----------
  function getCurrentLine(){
    const sel = window.getSelection();
    if(!sel.rangeCount) return null;
    let node = sel.getRangeAt(0).startContainer;
    while(node && node !== editor){
      if(node.nodeType === Node.ELEMENT_NODE && node.classList && node.classList.contains('el')) return node;
      node = node.parentNode;
    }
    return null;
  }

  // ---------- Init ----------
  function initEditor(){
    if(editor.children.length === 0){
      ensureEditorHasLine();
    }
    refreshAll();
    snapshot();
  }

  // ---------- Input handling ----------
  editor.addEventListener('keydown', (e)=>{
    const line = getCurrentLine();

    // Enter -> new action line by default, smart-follow for character->dialogue
    if(e.key === 'Enter'){
      e.preventDefault();
      if(!line) return;
      let nextType = 'action';
      if(line.dataset.type === 'character') nextType = 'dialogue';
      else if(line.dataset.type === 'dialogue') nextType = 'action';
      else if(line.dataset.type === 'parenthetical') nextType = 'dialogue';
      else if(line.dataset.type === 'scene') nextType = 'action';
      else if(line.dataset.type === 'transition') nextType = 'scene';

      const newLine = makeElement(nextType, '');
      line.insertAdjacentElement('afterend', newLine);
      placeCaretAtEnd(newLine);
      newLine.focus();
      snapshot();
      refreshAll();
      return;
    }

    // Tab -> cycle element type of current line
    if(e.key === 'Tab'){
      e.preventDefault();
      if(!line) return;
      const idx = TYPE_CYCLE.indexOf(line.dataset.type);
      const next = TYPE_CYCLE[(idx + (e.shiftKey ? TYPE_CYCLE.length-1 : 1)) % TYPE_CYCLE.length];
      setElType(line, next);
      line.dataset.manual = "1";
      refreshAll();
      snapshot();
      return;
    }

    // Backspace at start of line -> merge with previous
    if(e.key === 'Backspace'){
      const sel = window.getSelection();
      if(line && sel.isCollapsed){
        const range = sel.getRangeAt(0);
        const atStart = isCaretAtLineStart(line, range);
        if(atStart && line.previousElementSibling){
          e.preventDefault();
          const prev = line.previousElementSibling;
          const prevLen = getElText(prev).length;
          const text = getElText(line);
          // append text to prev
          appendTextToEl(prev, text);
          line.remove();
          placeCaretAtOffset(prev, prevLen);
          refreshAll();
          snapshot();
          return;
        }
      }
    }

    // Ctrl+1..6 force format
    if((e.ctrlKey || e.metaKey) && /^[1-6]$/.test(e.key)){
      e.preventDefault();
      if(!line) return;
      const type = TYPE_CYCLE[Number(e.key)-1] === undefined ? null : null;
      const map = ['scene','action','character','dialogue','parenthetical','transition'];
      setElType(line, map[Number(e.key)-1]);
      line.dataset.manual = "1";
      refreshAll();
      snapshot();
      return;
    }

    // Ctrl+Z / Ctrl+Shift+Z
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
      e.preventDefault();
      if(e.shiftKey) redo(); else undo();
      return;
    }
    // Ctrl+Y as redo
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){
      e.preventDefault();
      redo();
      return;
    }
    // Ctrl+F find
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f'){
      e.preventDefault();
      toggleFindBar(true);
      return;
    }
  });

  function isCaretAtLineStart(line, range){
    // check if range start is at position 0 of the line's text content
    const preRange = range.cloneRange();
    preRange.selectNodeContents(line);
    preRange.setEnd(range.startContainer, range.startOffset);
    let txt = preRange.toString();
    return txt.length === 0;
  }

  function appendTextToEl(el, text){
    el.appendChild(document.createTextNode(text));
  }

  function placeCaretAtOffset(el, offset){
    // place caret at end (simplify)
    placeCaretAtEnd(el);
  }

  editor.addEventListener('input', (e)=>{
    const line = getCurrentLine();
    if(line){
      maybeAutoFormat(line);
    }
    refreshAll();
    debounceSnapshot();
  });

  let snapTimer = null;
  function debounceSnapshot(){
    if(snapTimer) clearTimeout(snapTimer);
    snapTimer = setTimeout(snapshot, 400);
  }

  // ---------- Focus tracking for format pill ----------
  editor.addEventListener('focusin', updateFormatPill);
  document.addEventListener('selectionchange', ()=>{
    if(document.activeElement === editor || editor.contains(document.activeElement)){
      updateFormatPill();
    }
  });

  function updateFormatPill(){
    const line = getCurrentLine();
    formatPill.querySelectorAll('button').forEach(btn=>{
      btn.classList.toggle('current', line && btn.dataset.type === line.dataset.type);
    });
  }

  formatPill.querySelectorAll('button[data-type]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const line = getCurrentLine();
      if(!line) return;
      setElType(line, btn.dataset.type);
      line.dataset.manual = "1";
      placeCaretAtEnd(line);
      refreshAll();
      snapshot();
    });
  });

  // ---------- Scene list, stats ----------
  function refreshAll(){
    ensureEditorHasLine();
    buildSceneList();
    updateStats();
    updateFormatPill();
  }

  function buildSceneList(){
    const scenes = [];
    [...editor.children].forEach((el, i)=>{
      if(el.dataset.type === 'scene'){
        const text = getElText(el).trim() || '(untitled scene)';
        scenes.push({ el, text });
      }
    });
    if(scenes.length === 0){
      sceneList.innerHTML = '<div class="empty-scenes">Scene headings (start a line with INT. or EXT.) will appear here for quick navigation.</div>';
      return;
    }
    sceneList.innerHTML = '';
    scenes.forEach((s, idx)=>{
      const item = document.createElement('div');
      item.className = 'scene-item';
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = (idx+1) + '.';
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = s.text;
      item.appendChild(num);
      item.appendChild(label);
      item.addEventListener('click', ()=>{
        s.el.scrollIntoView({behavior:'smooth', block:'center'});
        placeCaretAtEnd(s.el);
        s.el.focus();
        if(window.matchMedia(NARROW_QUERY).matches) setSidebar(false);
      });
      sceneList.appendChild(item);
    });
    document.getElementById('statScenes').textContent = scenes.length;
  }

  function updateStats(){
    let wordCount = 0;
    [...editor.children].forEach(el=>{
      const text = getElText(el);
      const words = text.trim().split(/\s+/).filter(Boolean);
      wordCount += words.length;
    });
    document.getElementById('statWords').textContent = wordCount;
    // ~ 1 page per 230 words (rough screenplay estimate)
    const pages = Math.max(1, Math.round(wordCount / 230));
    document.getElementById('statPages').textContent = pages;
    // ~1 page per minute screen time
    document.getElementById('statTime').textContent = pages + ' min';
  }

  // ---------- Toolbar actions ----------
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);

  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  const NARROW_QUERY = '(max-width: 900px)';

  function setSidebar(open){
    sidebar.classList.toggle('collapsed', !open);
    sidebarBackdrop.classList.toggle('show', open && window.matchMedia(NARROW_QUERY).matches);
  }

  document.getElementById('sidebarBtn').addEventListener('click', ()=>{
    const isOpen = !sidebar.classList.contains('collapsed');
    setSidebar(!isOpen);
  });

  sidebarBackdrop.addEventListener('click', ()=> setSidebar(false));

  // Start with the drawer closed on tablet/phone, open on desktop
  if(window.matchMedia(NARROW_QUERY).matches){
    sidebar.classList.add('collapsed');
  }

  // ---------- localStorage persistence ----------
  const STORAGE_KEY = 'drafted_scripts';

  function loadScripts(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e){ return []; }
  }

  function saveScripts(scripts){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scripts));
  }

  function saveCurrentScript(){
    if(!currentScriptId) return;
    const scripts = loadScripts();
    const idx = scripts.findIndex(s => s.id === currentScriptId);
    const data = {
      id: currentScriptId,
      title: fileTitle.value || 'Untitled Screenplay',
      html: editor.innerHTML,
      updatedAt: Date.now(),
      wordCount: parseInt(document.getElementById('statWords').textContent) || 0,
      pages: parseInt(document.getElementById('statPages').textContent) || 1
    };
    if(idx >= 0) scripts[idx] = data;
    else scripts.unshift(data);
    // keep max 50 scripts
    saveScripts(scripts.slice(0, 50));
  }

  // ---------- Routing ----------
  const homeScreen = document.getElementById('homeScreen');
  const editorScreen = document.getElementById('editorScreen');
  const scriptsGrid = document.getElementById('scriptsGrid');
  let currentScriptId = null;

  function showHome(){
    saveCurrentScript();
    currentScriptId = null;
    editorScreen.classList.remove('active');
    homeScreen.classList.remove('hidden');
    renderScriptCards();
  }

  function showEditor(scriptId){
    homeScreen.classList.add('hidden');
    editorScreen.classList.add('active');
    currentScriptId = scriptId;
    const scripts = loadScripts();
    const script = scripts.find(s => s.id === scriptId);
    if(script){
      fileTitle.value = script.title;
      editor.innerHTML = script.html || '';
    } else {
      fileTitle.value = 'Untitled Screenplay';
      editor.innerHTML = '';
    }
    history = [];
    historyIndex = -1;
    ensureEditorHasLine();
    refreshAll();
    snapshot();
    if(window.matchMedia(NARROW_QUERY).matches) setSidebar(false);
    const firstLine = editor.firstElementChild;
    if(firstLine){ firstLine.focus(); placeCaretAtEnd(firstLine); }
  }

  function createNewScript(){
    const id = 'script_' + Date.now();
    const scripts = loadScripts();
    scripts.unshift({ id, title: 'Untitled Screenplay', html: '', updatedAt: Date.now(), wordCount: 0, pages: 1 });
    saveScripts(scripts);
    showEditor(id);
  }

  function deleteScript(id, e){
    e.stopPropagation();
    if(!confirm('Delete this script? This cannot be undone.')) return;
    const scripts = loadScripts().filter(s => s.id !== id);
    saveScripts(scripts);
    renderScriptCards();
  }

  function formatDate(ts){
    const d = new Date(ts);
    const now = new Date();
    const diff = (now - d) / 1000;
    if(diff < 60) return 'just now';
    if(diff < 3600) return Math.floor(diff/60) + 'm ago';
    if(diff < 86400) return Math.floor(diff/3600) + 'h ago';
    if(diff < 604800) return Math.floor(diff/86400) + 'd ago';
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }

  function renderScriptCards(){
    const scripts = loadScripts();
    if(scripts.length === 0){
      scriptsGrid.innerHTML = `<div class="empty-home"><strong>No scripts yet</strong>Tap "New Script" to start your first screenplay.</div>`;
      return;
    }
    scriptsGrid.innerHTML = '';
    scripts.forEach(script => {
      const card = document.createElement('div');
      card.className = 'script-card';
      card.innerHTML = `
        <div class="card-icon">SCREENPLAY</div>
        <div class="card-title">${escapeHtml(script.title)}</div>
        <div class="card-meta">
          <span>${script.pages || 1} pg</span>
          <span>${script.wordCount || 0} words</span>
          <span>${formatDate(script.updatedAt)}</span>
        </div>
        <button class="card-delete" title="Delete">✕</button>
      `;
      card.addEventListener('click', () => showEditor(script.id));
      card.querySelector('.card-delete').addEventListener('click', (e) => deleteScript(script.id, e));
      scriptsGrid.appendChild(card);
    });
  }

  function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Auto-save as user types (debounced)
  let autoSaveTimer = null;
  function scheduleAutoSave(){
    if(autoSaveTimer) clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(saveCurrentScript, 1200);
  }

  // Patch debounceSnapshot to also trigger auto-save
  const _origDebounce = debounceSnapshot;
  function debounceSnapshotAndSave(){
    debounceSnapshot();
    scheduleAutoSave();
  }

  // ---------- Wire up navigation ----------
  document.getElementById('newScriptBtn').addEventListener('click', createNewScript);
  document.getElementById('backBtn').addEventListener('click', showHome);

  // Save on title change
  fileTitle.addEventListener('input', scheduleAutoSave);

  // ---------- Export: shared helpers ----------
  function getFileBaseName(){
    return (fileTitle.value || 'screenplay').trim().replace(/[^a-z0-9\-_ ]/gi,'') || 'screenplay';
  }

  function getScriptLines(){
    // Returns array of { type, text }
    return [...editor.children].map(el => ({
      type: el.dataset.type,
      text: getElText(el).trim()
    }));
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- Export: Plain text ----------
  function exportAsTxt(){
    let text = '';
    getScriptLines().forEach(({type, text: raw})=>{
      if(raw === ''){ text += '\n'; return; }
      let line = raw;
      if(type === 'scene' || type === 'transition'){
        line = raw.toUpperCase();
      } else if(type === 'character'){
        line = '\t\t\t' + raw.toUpperCase();
      } else if(type === 'dialogue'){
        line = '\t' + raw;
      } else if(type === 'parenthetical'){
        line = '\t\t' + raw;
      }
      text += line + '\n';
      if(type === 'scene' || type === 'transition') text += '\n';
    });
    downloadBlob(new Blob([text], {type:'text/plain'}), getFileBaseName() + '.txt');
  }

  // ---------- Export: PDF (industry screenplay margins via jsPDF) ----------
  function exportAsPdf(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'in', format: 'letter' });
    const pageWidth = 8.5, pageHeight = 11;
    const leftMargin = 1.5, rightMargin = 1.0, topMargin = 1.0, bottomMargin = 1.0;
    const contentWidth = pageWidth - leftMargin - rightMargin;
    const fontSize = 12;
    const lineHeight = fontSize * 1.0 / 72 * 1.85; // approx double-spaced-ish courier line
    doc.setFont('courier', 'normal');
    doc.setFontSize(fontSize);

    let y = topMargin;

    function newPageIfNeeded(extra){
      if(y + extra > pageHeight - bottomMargin){
        doc.addPage();
        y = topMargin;
      }
    }

    function writeWrapped(text, x, maxWidth, upper, bold){
      const content = upper ? text.toUpperCase() : text;
      doc.setFont('courier', bold ? 'bold' : 'normal');
      const wrapped = doc.splitTextToSize(content, maxWidth);
      wrapped.forEach(ln=>{
        newPageIfNeeded(lineHeight);
        doc.text(ln, x, y);
        y += lineHeight;
      });
    }

    getScriptLines().forEach(({type, text})=>{
      if(text === ''){ y += lineHeight * 0.5; return; }

      if(type === 'scene'){
        y += lineHeight * 0.6;
        newPageIfNeeded(lineHeight);
        writeWrapped(text, leftMargin, contentWidth, true, true);
      } else if(type === 'transition'){
        y += lineHeight * 0.6;
        const upperText = text.toUpperCase();
        doc.setFont('courier', 'normal');
        const tw = doc.getTextWidth(upperText);
        newPageIfNeeded(lineHeight);
        doc.text(upperText, leftMargin + contentWidth - tw, y);
        y += lineHeight;
      } else if(type === 'character'){
        y += lineHeight * 0.6;
        writeWrapped(text, leftMargin + contentWidth * 0.38, contentWidth * 0.5, true, true);
      } else if(type === 'parenthetical'){
        writeWrapped(text, leftMargin + contentWidth * 0.30, contentWidth * 0.40, false, false);
      } else if(type === 'dialogue'){
        writeWrapped(text, leftMargin + contentWidth * 0.18, contentWidth * 0.64, false, false);
      } else {
        writeWrapped(text, leftMargin, contentWidth, false, false);
      }
    });

    doc.save(getFileBaseName() + '.pdf');
  }

  // ---------- Export: Word (.docx via docx-js browser bundle) ----------
  async function exportAsDocx(){
    const {
      Document, Packer, Paragraph, TextRun, AlignmentType
    } = window.docx;

    const children = [];

    getScriptLines().forEach(({type, text})=>{
      if(text === ''){
        children.push(new Paragraph({ children: [new TextRun('')] }));
        return;
      }
      let para;
      if(type === 'scene'){
        para = new Paragraph({
          spacing: { before: 240 },
          children: [new TextRun({ text: text.toUpperCase(), bold: true, font: 'Courier New', size: 24 })]
        });
      } else if(type === 'transition'){
        para = new Paragraph({
          spacing: { before: 240 },
          alignment: AlignmentType.RIGHT,
          children: [new TextRun({ text: text.toUpperCase(), font: 'Courier New', size: 24 })]
        });
      } else if(type === 'character'){
        para = new Paragraph({
          spacing: { before: 240 },
          indent: { left: 2160 },
          children: [new TextRun({ text: text.toUpperCase(), bold: true, font: 'Courier New', size: 24 })]
        });
      } else if(type === 'parenthetical'){
        para = new Paragraph({
          indent: { left: 1800, right: 1440 },
          children: [new TextRun({ text: text, italics: true, font: 'Courier New', size: 24 })]
        });
      } else if(type === 'dialogue'){
        para = new Paragraph({
          indent: { left: 1080, right: 1080 },
          children: [new TextRun({ text: text, font: 'Courier New', size: 24 })]
        });
      } else {
        para = new Paragraph({
          children: [new TextRun({ text: text, font: 'Courier New', size: 24 })]
        });
      }
      children.push(para);
    });

    const doc = new Document({
      sections: [{
        properties: {
          page: {
            size: { width: 12240, height: 15840 },
            margin: { top: 1440, right: 1440, bottom: 1440, left: 2160 }
          }
        },
        children
      }]
    });

    const blob = await Packer.toBlob(doc);
    downloadBlob(blob, getFileBaseName() + '.docx');
  }

  // ---------- Menu wiring ----------
  const menuBtn = document.getElementById('menuBtn');
  const exportDropdown = document.getElementById('exportDropdown');
  const menuBackdrop = document.getElementById('menuBackdrop');

  function setMenu(open){
    exportDropdown.classList.toggle('open', open);
    menuBtn.classList.toggle('active', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    menuBackdrop.classList.toggle('show', open);
  }

  menuBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    setMenu(!exportDropdown.classList.contains('open'));
  });
  menuBackdrop.addEventListener('click', ()=> setMenu(false));
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') setMenu(false);
  });

  document.getElementById('exportTxt').addEventListener('click', ()=>{
    setMenu(false);
    exportAsTxt();
  });
  document.getElementById('exportPdf').addEventListener('click', ()=>{
    setMenu(false);
    try{
      exportAsPdf();
    }catch(err){
      console.error(err);
      alert('PDF export failed to load. Check your connection and try again.');
    }
  });
  document.getElementById('exportDocx').addEventListener('click', async ()=>{
    setMenu(false);
    try{
      await exportAsDocx();
    }catch(err){
      console.error(err);
      alert('Word export failed to load. Check your connection and try again.');
    }
  });

  // ---------- Find & Replace ----------
  const findInput = document.getElementById('findInput');
  const replaceInput = document.getElementById('replaceInput');
  const findCount = document.getElementById('findCount');
  let matches = [];
  let matchIndex = -1;

  document.getElementById('findBtn').addEventListener('click', ()=> toggleFindBar());
  document.getElementById('findClose').addEventListener('click', ()=> toggleFindBar(false));

  function toggleFindBar(forceOpen){
    const show = forceOpen !== undefined ? forceOpen : findBar.classList.contains('hidden');
    findBar.classList.toggle('hidden', !show);
    if(show){
      findInput.focus();
      findInput.select();
      runSearch();
    } else {
      clearHighlights();
    }
  }

  function clearHighlights(){
    editor.querySelectorAll('mark.found').forEach(m=>{
      const parent = m.parentNode;
      while(m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      parent.normalize();
    });
    matches = [];
    matchIndex = -1;
  }

  function runSearch(){
    clearHighlights();
    const query = findInput.value;
    if(!query){ findCount.textContent=''; return; }
    const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null);
    const textNodes = [];
    let node;
    while(node = walker.nextNode()){
      textNodes.push(node);
    }
    const lowerQuery = query.toLowerCase();
    textNodes.forEach(tn=>{
      const text = tn.textContent;
      const lower = text.toLowerCase();
      let idx = 0;
      let found = [];
      let pos;
      while((pos = lower.indexOf(lowerQuery, idx)) !== -1){
        found.push(pos);
        idx = pos + lowerQuery.length;
      }
      if(found.length === 0) return;
      const frag = document.createDocumentFragment();
      let last = 0;
      found.forEach(pos=>{
        if(pos > last) frag.appendChild(document.createTextNode(text.slice(last,pos)));
        const mark = document.createElement('mark');
        mark.className = 'found';
        mark.textContent = text.slice(pos, pos+query.length);
        frag.appendChild(mark);
        matches.push(mark);
        last = pos + query.length;
      });
      if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      tn.parentNode.replaceChild(frag, tn);
    });
    findCount.textContent = matches.length ? `${matches.length} found` : 'No matches';
    if(matches.length){
      matchIndex = 0;
      highlightCurrent();
    }
  }

  function highlightCurrent(){
    matches.forEach(m=>m.classList.remove('active'));
    if(matches[matchIndex]){
      matches[matchIndex].classList.add('active');
      matches[matchIndex].scrollIntoView({behavior:'smooth', block:'center'});
      findCount.textContent = `${matchIndex+1} of ${matches.length}`;
    }
  }

  findInput.addEventListener('input', runSearch);
  document.getElementById('findNext').addEventListener('click', ()=>{
    if(!matches.length) return;
    matchIndex = (matchIndex + 1) % matches.length;
    highlightCurrent();
  });

  document.getElementById('replaceOne').addEventListener('click', ()=>{
    if(!matches.length || matchIndex < 0) return;
    const mark = matches[matchIndex];
    const replacement = document.createTextNode(replaceInput.value);
    mark.parentNode.replaceChild(replacement, mark);
    mark.parentNode.normalize();
    runSearch();
    refreshAll();
    snapshot();
  });

  document.getElementById('replaceAll').addEventListener('click', ()=>{
    if(!matches.length) return;
    const replacement = replaceInput.value;
    [...matches].forEach(mark=>{
      const tn = document.createTextNode(replacement);
      mark.parentNode.replaceChild(tn, mark);
      mark.parentNode.normalize();
    });
    matches = [];
    findCount.textContent = 'Replaced all';
    refreshAll();
    snapshot();
  });

  // close find bar on Escape
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && !findBar.classList.contains('hidden')){
      toggleFindBar(false);
    }
  });

  // ---------- PWA: service worker + install prompt ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('service-worker.js').catch(()=>{
        // service worker registration can fail in some sandboxed/preview contexts; app still works online
      });
    });
  }

  let deferredInstallPrompt = null;
  const installBtn = document.getElementById('installApp');
  const installDivider = document.getElementById('installDivider');

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.style.display = 'flex';
    installDivider.style.display = 'block';
  });

  installBtn.addEventListener('click', async ()=>{
    setMenu(false);
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    if(outcome === 'accepted'){
      installBtn.style.display = 'none';
      installDivider.style.display = 'none';
    }
    deferredInstallPrompt = null;
  });

  window.addEventListener('appinstalled', ()=>{
    installBtn.style.display = 'none';
    installDivider.style.display = 'none';
    deferredInstallPrompt = null;
  });

  // Patch the editor input listener to also schedule auto-save
  editor.addEventListener('input', scheduleAutoSave);

  // Start on the homepage
  showHome();
})();
</script>
</body>
</html>
